name: Documentation improvement
description: Report unclear, missing or outdated documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: README section, docs/INSTALLATION.md, command help...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
      description: Explain what you tried to understand or complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction
      description: Optional wording, example or structure that would help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the current default branch.
          required: true
        - label: I did not include private data, credentials or personal paths.
          required: true
